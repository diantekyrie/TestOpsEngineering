<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact TestOps Engineering for a scoped QA consulting quote.">
<meta property="og:image" content="testops_image.png">
<title>Contact — TestOps Engineering</title>
<link rel="icon" type="image/png" href="testops_image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/contact.css">
<!-- Vercel Web Analytics -->
<script src="js/analytics.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="index.html"><img src="test_ops_logo.png" alt="TestOps Engineering logo">TestOps Engineering</a>
    <a class="back" href="index.html">Back to site</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="kicker">Contact</p>
    <h1>Tell me about your QA goals</h1>
    <p class="sub">Share your current setup, problems, and timeline. I'll review and send back a scoped recommendation and quote.</p>
    <p class="note">Before publishing: replace <code>YOUR_EMAIL@example.com</code> in the form action with your email.</p>
  </section>

  <form action="https://formsubmit.co/YOUR_EMAIL@example.com" method="POST">
    <input type="hidden" name="_subject" value="New TestOps inquiry">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://testopseng.com/thanks/">

    <div class="grid">
      <div class="row">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>
      </div>
      <div class="row">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" required>
      </div>
    </div>

    <div class="grid">
      <div class="row">
        <label for="company">Company</label>
        <input id="company" name="company" type="text">
      </div>
      <div class="row">
        <label for="company_size">Company size</label>
        <select id="company_size" name="company_size">
          <option value="">Select one</option>
          <option>1–10</option>
          <option>11–50</option>
          <option>51–200</option>
          <option>201–500</option>
          <option>500+</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="row">
        <label for="service">Service needed</label>
        <select id="service" name="service" required>
          <option value="">Select one</option>
          <option>QA Audit & Roadmap</option>
          <option>Automation Build</option>
          <option>Release Reliability / Flakiness</option>
          <option>AI & LLM Testing</option>
        </select>
      </div>
      <div class="row">
        <label for="timeline">Timeline</label>
        <select id="timeline" name="timeline">
          <option>ASAP</option>
          <option>Within 30 days</option>
          <option>1–3 months</option>
          <option>Just exploring</option>
        </select>
      </div>
    </div>

    <div class="row">
      <label for="message">What are you trying to improve?</label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <button class="btn" type="submit">Send inquiry</button>
  </form>
</main>

<footer>
  <div class="wrap">© 2026 TestOps Engineering</div>
</footer>
</body>
</html>
